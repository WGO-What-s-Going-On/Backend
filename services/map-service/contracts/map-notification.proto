syntax = "proto3";
package wgo.map.notifications.v1;

// Only notification-service may call these RPCs. Existing Map contracts are unchanged.
service MapNotificationRecipients {
  rpc BeginSnapshot (BeginSnapshotRequest) returns (Snapshot);
  rpc AddRecipients (AddRecipientsRequest) returns (Snapshot);
  rpc PublishSnapshot (Snapshot) returns (Snapshot);
  rpc FindNearbyUsers (NearbyUsersRequest) returns (NearbyUsersResponse);
}
message BeginSnapshotRequest { uint32 expected_count = 1; }
message Snapshot { string snapshot_id = 1; }
message ConsentingRecipient {
  int64 user_id = 1;
  string revision = 2;
  int64 expires_at_ms = 3;
}
message AddRecipientsRequest {
  string snapshot_id = 1;
  repeated ConsentingRecipient recipients = 2;
}
message NearbyUsersRequest {
  double latitude = 1;
  double longitude = 2;
  double participation_radius_m = 3;
  int64 author_id = 4;
  uint32 limit = 5;
  string after_user_id = 6;
}
message NearbyUser { int64 user_id = 1; string revision = 2; }
message NearbyUsersResponse {
  repeated NearbyUser users = 1;
  string next_after_user_id = 2;
}
