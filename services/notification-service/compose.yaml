services:
  redis:
    image: redis:8-alpine
    profiles: ['redis']
    ports:
      - '6382:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 10
  dynamodb:
    image: amazon/dynamodb-local:latest
    profiles: ['dynamodb']
    command: '-jar DynamoDBLocal.jar -inMemory -sharedDb'
    ports:
      - '8002:8000'
