services:
  redis:
    image: redis:8-alpine
    profiles: ['redis']
    ports:
      - '127.0.0.1:6382:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 10
  postgres:
    image: postgres:18-alpine
    profiles: ['postgres']
    environment:
      POSTGRES_USER: wgo
      POSTGRES_PASSWORD: wgo
      POSTGRES_DB: wgo_notification
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - notification-postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'wgo', '-d', 'wgo_notification']
      interval: 2s
      timeout: 2s
      retries: 10
volumes:
  notification-postgres:
