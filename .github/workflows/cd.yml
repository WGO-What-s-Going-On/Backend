name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_services:
        description: 'Secret/task configuration rotation: comma-separated service names, all, or empty'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# A queued run may be replaced by a newer one. Per-service last-success state catches up skipped changes.
# Never cancel a deployment or approval already in progress.
concurrency:
  group: wgo-cd
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # This must precede checkout: never execute a candidate branch's validator with deployment trust.
      - name: Reject untrusted release source before checkout
        env:
          CD_BRANCH: ${{ secrets.CD_BRANCH }}
          CD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const e = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const branch = process.env.CD_BRANCH;
          const sha = process.env.CD_SHA;
          if (branch !== e.repository.default_branch) throw new Error('CD_BRANCH must be the repository default branch');
          if (!branch || !/^[a-f0-9]{40}$/.test(sha ?? '')) throw new Error('Missing trusted release configuration');
          if (e.workflow_run) {
            const r = e.workflow_run;
            if (r.event !== 'push' || r.conclusion !== 'success' || r.head_branch !== branch || r.head_sha !== sha || r.head_repository?.full_name !== process.env.GITHUB_REPOSITORY) throw new Error('Untrusted release source');
          } else if (process.env.GITHUB_REF !== `refs/heads/${branch}`) {
            throw new Error('Manual release must use CD_BRANCH');
          }
          JS
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify trusted branch and exact successful CI commit
        env:
          CD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CD_BRANCH: ${{ secrets.CD_BRANCH }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cd.mjs verify

  staging:
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      CD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CD_FORCE_SERVICES: ${{ inputs.force_services || '' }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      CD_IMAGE_PLATFORM: ${{ secrets.CD_IMAGE_PLATFORM }}
      CD_STATE_PREFIX: ${{ secrets.CD_STATE_PREFIX }}
      CD_SERVICES_JSON: ${{ secrets.CD_SERVICES_JSON }}
      CD_RUNTIME_SECRETS_JSON: ${{ secrets.CD_RUNTIME_SECRETS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to ECR without logging credentials
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - name: Build changed images and deploy staging
        run: node scripts/cd.mjs staging
      - name: Save tested immutable release (no task definitions or secret values)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.event.workflow_run.head_sha || github.sha }}
          path: release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Remove registry credentials
        if: always()
        run: docker logout "$ECR_REGISTRY"

  production:
    needs: staging
    runs-on: ubuntu-latest
    # Configure required reviewers and branch restrictions in this GitHub Environment.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      CD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CD_FORCE_SERVICES: ${{ inputs.force_services || '' }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      CD_IMAGE_PLATFORM: ${{ secrets.CD_IMAGE_PLATFORM }}
      CD_STATE_PREFIX: ${{ secrets.CD_STATE_PREFIX }}
      CD_SERVICES_JSON: ${{ secrets.CD_SERVICES_JSON }}
      CD_RUNTIME_SECRETS_JSON: ${{ secrets.CD_RUNTIME_SECRETS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true
      - name: Promote exact staging digests and verify production
        run: node scripts/cd.mjs production
