name: CD

on:
  workflow_dispatch:
    inputs:
      initial_deployment:
        description: 'Bootstrap GKE staging applications after infrastructure initialization'
        type: boolean
        default: false
        required: true
  # Require reviewed PRs and successful CI through main branch protection.
  push:
    branches: [main]

permissions:
  contents: read

# A queued run may be replaced by a newer one. Per-service last-success state catches up skipped changes.
# Never cancel a deployment or approval already in progress.
concurrency:
  group: wgo-cd
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Manual runs use the same trusted main ref and never promote to production.
      - name: Reject untrusted release source before checkout
        env:
          CD_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const e = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const sha = process.env.GITHUB_SHA;
          const trusted = process.env.GITHUB_REF === 'refs/heads/main' &&
            e.repository?.full_name === process.env.GITHUB_REPOSITORY &&
            /^[a-f0-9]{40}$/.test(sha ?? '') && !/^0{40}$/.test(sha) && sha === process.env.CD_SHA;
          const push = process.env.GITHUB_EVENT_NAME === 'push' &&
            e.ref === 'refs/heads/main' && e.deleted === false && e.after === sha;
          const manual = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' &&
            ['true', 'false'].includes(String(e.inputs?.initial_deployment));
          if (!trusted || (!push && !manual))
            throw new Error('Only a main push or explicit main staging dispatch with a matching SHA can deploy');
          JS

  staging:
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      CD_SHA: ${{ github.sha }}
      CD_INITIAL_DEPLOYMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.initial_deployment && 'true' || 'false' }}
      CD_BUILD_CONCURRENCY: ${{ vars.CD_BUILD_CONCURRENCY || '2' }}
      CD_DEPLOY_CONCURRENCY: ${{ vars.CD_DEPLOY_CONCURRENCY || '4' }}
      CD_FORCE_SERVICES: ${{ vars.CD_FORCE_SERVICES }}
      CD_IMAGE_PLATFORM: linux/amd64
      GCP_ENV_FILE: /tmp/wgo-gcp-environment.json
      GCP_ENV_JSON: ${{ vars.GCP_ENV_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate non-secret environment configuration
        id: config
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync, appendFileSync } from 'node:fs';
          import { validateEnvironment, clusterLocation } from './scripts/gke-lib.mjs';
          const config = validateEnvironment(JSON.parse(process.env.GCP_ENV_JSON));
          writeFileSync(process.env.GCP_ENV_FILE, JSON.stringify(config), { mode: 0o600 });
          appendFileSync(process.env.GITHUB_OUTPUT, `project=${config.project}\ncluster=${config.cluster}\nlocation=${clusterLocation(config)}\n`);
          JS
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ steps.config.outputs.project }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin
      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ steps.config.outputs.cluster }}
          location: ${{ steps.config.outputs.location }}
          project_id: ${{ steps.config.outputs.project }}
          use_dns_based_endpoint: true
          use_auth_provider: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate Artifact Registry
        run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
      - name: Build changed images and deploy GKE
        run: node scripts/cd.mjs staging
      - name: Save verified image digests without runtime secrets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Remove registry credentials
        if: always()
        run: docker logout asia-northeast3-docker.pkg.dev

  production:
    needs: staging
    if: github.event_name == 'push' && vars.CD_ENABLE_PRODUCTION == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      CD_SHA: ${{ github.sha }}
      CD_INITIAL_DEPLOYMENT: 'false'
      CD_BUILD_CONCURRENCY: ${{ vars.CD_BUILD_CONCURRENCY || '2' }}
      CD_DEPLOY_CONCURRENCY: ${{ vars.CD_DEPLOY_CONCURRENCY || '4' }}
      CD_FORCE_SERVICES: ${{ vars.CD_FORCE_SERVICES }}
      CD_IMAGE_PLATFORM: linux/amd64
      GCP_ENV_FILE: /tmp/wgo-gcp-environment.json
      GCP_ENV_JSON: ${{ vars.GCP_ENV_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate non-secret environment configuration
        id: config
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync, appendFileSync } from 'node:fs';
          import { validateEnvironment, clusterLocation } from './scripts/gke-lib.mjs';
          const config = validateEnvironment(JSON.parse(process.env.GCP_ENV_JSON));
          writeFileSync(process.env.GCP_ENV_FILE, JSON.stringify(config), { mode: 0o600 });
          appendFileSync(process.env.GITHUB_OUTPUT, `project=${config.project}\ncluster=${config.cluster}\nlocation=${clusterLocation(config)}\n`);
          JS
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ steps.config.outputs.project }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin
      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ steps.config.outputs.cluster }}
          location: ${{ steps.config.outputs.location }}
          project_id: ${{ steps.config.outputs.project }}
          use_dns_based_endpoint: true
          use_auth_provider: true
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
      - name: Promote the staging digests without rebuilding
        run: node scripts/cd.mjs production
