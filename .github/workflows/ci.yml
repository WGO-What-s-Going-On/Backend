name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      has_services: ${{ steps.changes.outputs.has_services }}
      deploy_matrix: ${{ steps.changes.outputs.deploy_matrix }}
      has_deploy: ${{ steps.changes.outputs.has_deploy }}
      integration_user_gateway: ${{ steps.changes.outputs.integration_user_gateway }}
      integration_ws_post: ${{ steps.changes.outputs.integration_ws_post }}
      comparison_base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || steps.baseline.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Find last successful push CI on this branch
        if: github.event_name == 'push'
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-base.mjs
      - name: Find changed services and affected contracts
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ steps.baseline.outputs.base }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            node scripts/ci.mjs detect "$PR_BASE_SHA" HEAD --pr
          elif [ "$EVENT_NAME" = push ]; then
            node scripts/ci.mjs detect "$PUSH_BASE_SHA"
          else
            node scripts/ci.mjs detect
          fi

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test CI and CD selection and deployment helpers
        run: node --test scripts/*.test.mjs
      - name: Check duplicated Map RPC contract
        run: diff -u services/map-service/contracts/map-authorization.proto services/post-service/contracts/map-authorization.proto

  format:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check changed files with Prettier
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ needs.detect.outputs.comparison_base }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            node scripts/ci.mjs format "$PR_BASE_SHA" HEAD --pr
          elif [ "$EVENT_NAME" = push ]; then
            node scripts/ci.mjs format "$PUSH_BASE_SHA"
          else
            node scripts/ci.mjs format
          fi

  test:
    needs: detect
    if: needs.detect.outputs.has_services == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@10.33.0
      - name: Install selected service
        env:
          SERVICE: ${{ matrix.name }}
        run: node scripts/ci-run.mjs "$SERVICE" install
      - name: Start only selected service dependencies
        env:
          SERVICE: ${{ matrix.name }}
        run: node scripts/ci-dependencies.mjs start "$SERVICE"
      - name: Typecheck, lint, unit/integration tests and build
        env:
          SERVICE: ${{ matrix.name }}
        run: node scripts/ci-run.mjs "$SERVICE"
      - name: Build changed runtime image
        if: matrix.build_image
        env:
          SERVICE_PATH: ${{ matrix.path }}
          SERVICE: ${{ matrix.name }}
        run: docker build --tag "wgo-ci/$SERVICE:${GITHUB_SHA}" "$SERVICE_PATH"
      - name: Stop isolated dependencies
        if: always()
        env:
          SERVICE: ${{ matrix.name }}
        run: node scripts/ci-dependencies.mjs stop "$SERVICE"

  user-gateway:
    needs: detect
    if: needs.detect.outputs.integration_user_gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@10.33.0
      - name: Install contract participants and build Gateway artifact
        run: |
          node scripts/ci-run.mjs http-gateway install
          node scripts/ci-run.mjs http-gateway build
          node scripts/ci-run.mjs user-service install
      - run: node scripts/ci-dependencies.mjs start user-service
      - name: Exercise actual Gateway to User authentication flow
        working-directory: services/user-service
        env:
          RUN_GATEWAY_INTEGRATION: '1'
        run: pnpm exec vitest run test/auth.integration.test.ts
      - if: always()
        run: node scripts/ci-dependencies.mjs stop user-service

  ws-post:
    needs: detect
    if: needs.detect.outputs.integration_ws_post == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@10.33.0
      - name: Build WS and Map contract participants
        run: |
          node scripts/ci-run.mjs ws-gateway install
          node scripts/ci-run.mjs ws-gateway build
          node scripts/ci-run.mjs map-service install
          node scripts/ci-run.mjs map-service build
          node scripts/ci-run.mjs post-service install
      - run: node scripts/ci-dependencies.mjs start post-service
      - name: Exercise actual WS to Post participation and Map policy
        working-directory: services/post-service
        env:
          RUN_INTEGRATION: '1'
          RUN_WS_INTEGRATION: '1'
        run: pnpm exec vitest run test/post.integration.test.ts
      - if: always()
        run: node scripts/ci-dependencies.mjs stop post-service

  ci:
    if: always()
    needs: [detect, pipeline, format, test, user-gateway, ws-post]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          PIPELINE_RESULT: ${{ needs.pipeline.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CONTRACT_RESULT: ${{ needs.user-gateway.result }}
          WS_CONTRACT_RESULT: ${{ needs.ws-post.result }}
        run: |
          test "$DETECT_RESULT" = success
          test "$PIPELINE_RESULT" = success
          test "$FORMAT_RESULT" = success
          test "$TEST_RESULT" = success -o "$TEST_RESULT" = skipped
          test "$CONTRACT_RESULT" = success -o "$CONTRACT_RESULT" = skipped
          test "$WS_CONTRACT_RESULT" = success -o "$WS_CONTRACT_RESULT" = skipped
