services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wgo
      POSTGRES_PASSWORD: wgo
      POSTGRES_DB: wgo_user
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'wgo']
      interval: 2s
      timeout: 2s
      retries: 30
  redis6379:
    image: redis:8-alpine
    ports: ['127.0.0.1:6379:6379']
    healthcheck: &redis-health
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30
  redis6380:
    image: redis:8-alpine
    ports: ['127.0.0.1:6380:6379']
    healthcheck: *redis-health
  redis6381:
    image: redis:8-alpine
    ports: ['127.0.0.1:6381:6379']
    healthcheck: *redis-health
  redis6382:
    image: redis:8-alpine
    ports: ['127.0.0.1:6382:6379']
    healthcheck: *redis-health
  redis6383:
    image: redis:8-alpine
    ports: ['127.0.0.1:6383:6379']
    healthcheck: *redis-health
  mongo:
    image: mongo:8.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports: ['127.0.0.1:27017:27017']
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          'db.adminCommand({ ping: 1 }).ok',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
  cassandra:
    image: cassandra:4.1
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    ports: ['127.0.0.1:9042:9042']
    healthcheck:
      test: ['CMD-SHELL', 'cqlsh -e "DESCRIBE KEYSPACES" >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 30
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: '-jar DynamoDBLocal.jar -inMemory -sharedDb'
    ports: ['127.0.0.1:8002:8000']
